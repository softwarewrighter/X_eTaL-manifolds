slug = "representation-explorer"            # the directory name, demos/<slug>/
title = "Representation explorer: flat, the sphere and the disk"
summary = "Three data sets of the kit, three spaces to keep them in. Part 1: the same points kept flat (the straight line) and as directions on the unit sphere (the angle), on the flat clusters and the directions: three distances on the same pairs with one worked in full, a shortest path and a mean in each space, nearest neighbors and the decision boundary under each distance, a small classifier trained on each representation, and the distortion of each. Part 2: the Poincare disk, its distance worked and its shortest path drawn, the room a tree needs counted; the tree fitted in the plane, on the sphere and in the disk from the same start by the same steps, three starts for the spread, a classifier from each embedding, and the same fit at eight curvatures; the H1 table, seven cells of nine, with its null results."
concepts = ["representation", "great-circle distance", "cosine distance", "decision boundary", "cross-entropy", "distortion", "the Poincare disk", "curvature", "embedding", "tree distance", "local minimum"]
status = "live"              # draft | live | deferred
order = 30
track = "representation"     # start | representation | optimization | constraints | dynamics | adaptive (docs/plan.md, Tracks)
# Every demo compares (docs/plan.md, G5): the ML problem, two or more
# geometric choices compared on it, and the hypothesis it bears on.
problem = "classification by nearest neighbors and by a small network on flat clusters and on directions; an embedding of a tree that keeps its distances, and classification of its branches from it"
compares = ["flat: the points as they are, the straight line; the plane the tree is fitted in", "the sphere: the points' directions, the angle; the unit sphere the tree is fitted on", "the Poincare disk: the tree fitted in it, and at eight curvatures from +1 to -4"]
hypothesis = "H1"
needs = ["GM5", "GL1"]       # the split and the record are written out; so are the pairwise distances and neighbor orders (part 1) and, in Manifold, f_latDistances (part 2)
line = "\"u:s_tepDirUnit Dut Yd lr\" net:t_rain< \"3 8 tanh 4 softmax\""
why = "Net writes the whole training step, backpropagation and Adam, from the network's spec; the same line on each representation is what makes the two runs the same but for the space."
