[package]
name = "representation-explorer-web"
description = "Representation explorer: the same points kept flat and on the unit sphere, on flat clusters and on directions (part 1); the Poincare disk, and the tree fitted in the plane, on the sphere and in the disk at equal dimension, with curvature as a control (part 2); the test of H1"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
site = { path = "../../../shared/site" }
lesson = { path = "../../../work/xetal-ml/shared/lesson" }
microscope = { path = "../../../work/xetal-ml/shared/microscope" }
yew = { version = "0.21", features = ["csr"] }
console_error_panic_hook = "0.1"
gloo-timers = "0.3"

[workspace]
