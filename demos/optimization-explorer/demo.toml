title = "Optimization explorer: is downhill one direction?"
summary = "Part 1: one bowl-shaped loss that does not change, L = (x^2 + 3 y^2) / 2, its contours and its gradient field, and gradient descent on it under three rulers from the same start with the same step size policy (an exact line search): the plain step, a step under the metric diag(a, 1) with a as the control from 1/9 to 9, and Newton's direction (the loss's own curvature as the metric). The path and the steps to a target change; the bowl does not. The steepest direction at the start under two rulers, worked in full with each ruler's unit ball. Then on the sphere: the leading eigenvector of a small symmetric matrix climbed to by a step that stays on the sphere (Manifold's) against a flat step repaired afterward, with how far the flat step leaves the sphere measured."
