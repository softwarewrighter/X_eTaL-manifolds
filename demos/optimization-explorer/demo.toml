slug = "optimization-explorer"            # the directory name, demos/<slug>/
title = "Optimization explorer: is downhill one direction, and does a ruler pay?"
summary = "Part 1: one bowl-shaped loss that does not change, L = (x^2 + 3 y^2) / 2, its contours and its gradient field, and gradient descent on it under three rulers from the same start with the same step size policy (an exact line search): the plain step, a step under the metric diag(a, 1) with a as the control from 1/9 to 9, and Newton's direction (the loss's own curvature as the metric). The path and the steps to a target change; the bowl does not. The steepest direction at the start under two rulers, worked in full with each ruler's unit ball. Then on the sphere: the leading eigenvector of a small symmetric matrix climbed to by a step that stays on the sphere (Manifold's) against a flat step repaired afterward, with how far the flat step leaves the sphere measured. Part 2: a softmax model of six weights trained on the flat clusters from the same start, data and split by plain gradient descent, a diagonal preconditioner and the natural-gradient step (the exact Fisher, damped), once with one input twenty times too large and once as it is: loss by step, held-out accuracy, steps to a target, update sizes and the cost of a step counted; with the bad scaling the plain step does not settle at any of four rates and the metric pays; on clean data the natural step takes fewer steps and more multiplies, a null result for it; undamped, the natural step ignores any linear rewriting of the inputs and the diagonal only a rescaling."
