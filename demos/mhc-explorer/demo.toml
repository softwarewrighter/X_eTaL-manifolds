title = "mHC explorer: what may the mixing do?"
summary = "Part 1, the matrices: from one residual stream x + F(x) to three streams mixed by a 3 by 3 matrix as the mHC paper writes the layer; the doubly stochastic matrices of size 3, nine entries and four free, counted; the path from the identity to uniform mixing, every matrix on it doubly stochastic, its singular values 1 and 1 - t; Sinkhorn's iteration from a free positive matrix, one sweep worked in full, its errors by sweep to a tolerance; what a doubly stochastic, a free and an orthogonal matrix each do to a signal mixed 1, 10 and 100 times (the mean kept and the differences shrunk; the signal blown up or dying away; the length kept); the Birkhoff polytope, its corners the permutation matrices, a polytope and not a smooth manifold. Part 2, the stack: a small network of 4, 8, 16 and 32 layers over four streams with the plain residual, free, doubly stochastic (Sinkhorn on exp) and orthogonal (Cayley) mixing made from the same trained numbers; at the start, the signal's size up the stack, the gradient's down it, the streams' spread and the composite gain layer by layer over three seeds, drawn as a strip per layer; then trained on the flat clusters (48 offline runs read back, the first steps trained again on the page): free mixing's gain grows to 272 at 32 layers and its training stops being finite at 16 and 32, the constrained stacks train at every depth, the doubly stochastic one forgets its streams' differences, and against the plain residual no constraint differs beyond the seeds' range but one point at 8 layers; the H2 table."
